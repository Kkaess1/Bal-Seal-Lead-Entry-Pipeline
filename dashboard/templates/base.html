    /*
      Palette pulled from balseal.com's own stylesheet (brandastic theme):
      #28495a brand navy (buttons/active states), #f05329 brand orange
      (CTA accents / underline motif), #0072ce link blue, #1a262b near-black
      body text, #eeefef page background. Headings in Raleway, body in Noto
      Sans, matching the fonts the site itself loads from Google Fonts.
    */
    :root {
      color-scheme: light dark;

      /* Neutrals */
      --bg: #dadcdb;
      --surface: #ffffff;
      --surface-2: #f7f7f7;
      --border: #e2e4e3;
      --text: #1a262b;
      --text-muted: #5f6b70;
      --text-faint: #8996a3;

      /* Brand */
      --navy: #28495a;
      --navy-hover: #1a262b;
      --orange: #f05329;
      --accent: #0072ce;
      --accent-hover: #005ba3;

      /* Semantic (risk) */
      --clear-bg: #eaf6e2; --clear-fg: #4c8f14; --clear-border: #b9e29a;
      --review-bg: #fdece3; --review-fg: #d8471e; --review-border: #f6bfa5;
      --reject-bg: #fbe7e5; --reject-fg: #c0392b; --reject-border: #f0b3ab;

      --success: #4c8f14; --success-hover: #3d7410;
      --danger: #c0392b; --danger-hover: #a12f21;

      --radius: 10px;
      --radius-sm: 6px;
      --radius-pill: 50px;
      --shadow: 0 1px 2px rgba(26, 38, 43, 0.06), 0 1px 3px rgba(26, 38, 43, 0.08);
    }

    :root[data-theme="dark"] {
      --bg: #12191d; --surface: #1a262b; --surface-2: #202f36;
      --border: #2c3e46; --text: #eef2f3; --text-muted: #9aa8ad; --text-faint: #6b7d84;
      --navy: #6f97ab; --navy-hover: #eef2f3; --orange: #ff8158; --accent: #4fa8e8; --accent-hover: #7cc2f5;
      --clear-bg: #16321a; --clear-fg: #7ed957; --clear-border: #2d5a1a;
      --review-bg: #3a2216; --review-fg: #ff9868; --review-border: #6e3a1e;
      --reject-bg: #3a1613; --reject-fg: #ff7a68; --reject-border: #6e2620;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12191d; --surface: #1a262b; --surface-2: #202f36;
        --border: #2c3e46; --text: #eef2f3; --text-muted: #9aa8ad; --text-faint: #6b7d84;
        --navy: #6f97ab; --navy-hover: #eef2f3; --orange: #ff8158; --accent: #4fa8e8; --accent-hover: #7cc2f5;
        --clear-bg: #16321a; --clear-fg: #7ed957; --clear-border: #2d5a1a;
        --review-bg: #3a2216; --review-fg: #ff9868; --review-border: #6e3a1e;
        --reject-bg: #3a1613; --reject-fg: #ff7a68; --reject-border: #6e2620;
      }
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0; background: var(--bg); color: var(--text);
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }

    .top-strip { background: #28495a; height: 8px; }

    header {
      /* Always white, regardless of theme: the logo wordmark is solid black
         and needs a light plate behind it to stay legible in dark mode. */
      background: #fff; border-bottom: 3px solid var(--orange);
      padding: 0 1.5rem; display: flex; align-items: center; gap: 1.75rem;
    }
    header .brand { margin-right: auto; display: flex; align-items: center; }
    header .brand img { height: 104px; width: auto; display: block; }
    header nav { display: flex; gap: 1.5rem; }
    /* Fixed (theme-invariant) colors here too, to stay legible on the
       always-white header background. */
    header a {
      color: #5f6b70; text-decoration: none; font-size: 0.92rem; font-weight: 600;
      padding: 0.25rem 0; border-bottom: 2px solid transparent; transition: color 0.2s ease, border-color 0.2s ease;
    }
    header a.active { color: #28495a; border-bottom-color: var(--orange); }
    header a:hover { color: #28495a; }

    main { max-width: 1100px; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }
    main a { color: var(--accent); }
    main a:hover { color: var(--accent-hover); }

    h2 {
      font-family: 'Raleway', sans-serif; font-size: 1.35rem; font-weight: 800;
      letter-spacing: 0.01em; color: var(--text); margin: 0 0 0.6rem; position: relative;
    }
    h2::after { content: ''; display: block; width: 42px; height: 3px; background: var(--orange); margin-top: 0.5rem; }
    h3 { font-family: 'Raleway', sans-serif; font-size: 1.05rem; font-weight: 700; margin: 0 0 0.2rem; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 1.1rem 1.3rem; margin-bottom: 1rem;
      border-left: 3px solid var(--border);
    }
    .card.risk-clear { border-left-color: var(--clear-fg); }
    .card.risk-review { border-left-color: var(--review-fg); }
    .card.risk-reject { border-left-color: var(--reject-fg); }

    .meta { color: var(--text-muted); font-size: 0.85rem; margin: 0.15rem 0; }
    .meta strong { color: var(--text); font-weight: 600; }

    .badge {
      display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase;
      margin-right: 0.35rem; margin-bottom: 0.3rem; border: 1px solid transparent;
    }
    .badge-clear { background: var(--clear-bg); color: var(--clear-fg); border-color: var(--clear-border); }
    .badge-review { background: var(--review-bg); color: var(--review-fg); border-color: var(--review-border); }
    .badge-reject { background: var(--reject-bg); color: var(--reject-fg); border-color: var(--reject-border); }
    .badge-reason {
      background: var(--surface-2); color: var(--text-muted); border-color: var(--border);
      font-weight: 600; text-transform: none; letter-spacing: 0; cursor: help;
    }

    .actions { margin-top: 0.9rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
    button, .btn {
      border: 1.5px solid transparent; border-radius: var(--radius-pill); padding: 0.5rem 1.3rem;
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 0.35rem; transition: filter 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    button:hover, .btn:hover { filter: brightness(1.06); }
    button:active, .btn:active { filter: brightness(0.94); }
    .btn-approve { background: var(--success); color: #fff; }
    .btn-approve:hover { background: var(--success-hover); }
    .btn-reject { background: var(--danger); color: #fff; }
    .btn-reject:hover { background: var(--danger-hover); }
    .btn-secondary {
      background: transparent; color: var(--navy); border-color: var(--navy);
    }
    .btn-secondary:hover { background: var(--navy); color: #fff; filter: none; }

    .empty { color: var(--text-muted); padding: 3rem 0; text-align: center; font-size: 0.95rem; }
    .text-warn { color: var(--review-fg); font-weight: 600; }

    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.35rem; }
    .card-head h3 { margin: 0; }
    .card-head h3 a { color: var(--text); text-decoration: none; }
    .card-head h3 a:hover { color: var(--navy); }
    .field-name { font-family: "SF Mono", Consolas, monospace; font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; padding: 0.55rem 0.7rem; color: var(--navy); font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--border); }
    td { text-align: left; padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }

    label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin: 0.7rem 0 0.3rem; text-transform: uppercase; letter-spacing: 0.02em; }
    input[type=text], textarea {
      width: 100%; box-sizing: border-box; padding: 0.5rem 0.65rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit;
      background: var(--surface); color: var(--text);
    }
    input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    textarea { min-height: 5rem; line-height: 1.55; resize: vertical; }

    table.kv-table { width: auto; min-width: 60%; border-collapse: collapse; }
    table.kv-table td { padding: 0.4rem 0.7rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }
    table.kv-table tr:last-child td { border-bottom: none; }
    table.kv-table td:first-child { font-weight: 600; color: var(--text-muted); white-space: nowrap; width: 110px; }

    table.lead-table { width: 100%; margin-top: 0.7rem; }
    table.lead-table tr.row-risk-clear td:first-child { box-shadow: inset 3px 0 0 var(--clear-fg); }
    table.lead-table tr.row-risk-review td:first-child { box-shadow: inset 3px 0 0 var(--review-fg); }
    table.lead-table tr.row-risk-reject td:first-child { box-shadow: inset 3px 0 0 var(--reject-fg); }
    table.lead-table td.details-cell { white-space: pre-line; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="top-strip"></div>
  <header>
    <a class="brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="Bal Seal Engineering">
    </a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Pending Review{% if pending_count %} ({{ pending_count }}){% endif %}</a>
      <a href="{{ url_for('queue') }}" class="{{ 'active' if request.endpoint == 'queue' }}">Input Queue{% if staged_count or ready_count %} <span style="background:var(--accent); color:#fff; border-radius:10px; padding:2px 7px; font-size:0.75rem; margin-left:2px;">{{ staged_count + ready_count }}</span>{% endif %}</a>
      <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint == 'history' }}">History</a>
      <a href="{{ url_for('status') }}" class="{{ 'active' if request.endpoint == 'status' }}">Status</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    function scrollToLead(element) {
      if (!element) return;
      var header = document.querySelector('header');
      var headerHeight = header ? header.offsetHeight + 20 : 80;
      var elementTop = element.getBoundingClientRect().top + window.scrollY;
      window.scrollTo({
        top: Math.max(0, elementTop - headerHeight),
        behavior: 'smooth'
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      var csrfToken = document.querySelector('meta[name="csrf-token"]').content;
      document.querySelectorAll('form[method="post"], form[method="POST"]').forEach(function(form) {
        if (!form.querySelector('input[name="_csrf_token"]')) {
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = '_csrf_token';
          input.value = csrfToken;
          form.appendChild(input);
        }
      });
      if (sessionStorage.getItem('scroll_to_next_lead')) {
        sessionStorage.removeItem('scroll_to_next_lead');
        var firstCard = document.querySelector('.card');
        if (firstCard) {
          setTimeout(function() { scrollToLead(firstCard); }, 100);
        }
      }
    });

    // Intercept card Approve/Reject forms for smooth in-place removal and scrolling to next lead
    document.addEventListener('submit', function(e) {
      var form = e.target;
      if (form.action && (form.action.includes('/approve') || form.action.includes('/reject'))) {
        var card = form.closest('.card');
        if (card && !document.querySelector('textarea[name="review_notes"]')) {
          e.preventDefault();

          // Identify the next target card before removing current card
          var nextCard = card.nextElementSibling;
          if (!nextCard || !nextCard.classList.contains('card')) {
            nextCard = card.previousElementSibling;
            if (nextCard && !nextCard.classList.contains('card')) {
              nextCard = null;
            }
          }

          var btns = card.querySelectorAll('button, a.btn');
          btns.forEach(function(b) { b.disabled = true; b.style.opacity = '0.5'; });

          fetch(form.action, {
            method: form.method || 'POST',
            body: new FormData(form),
            headers: {
              'X-Requested-With': 'XMLHttpRequest',
              'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content
            }
          }).then(function(res) {
            if (res.ok) {
              card.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
              card.style.opacity = '0';
              card.style.transform = 'scale(0.98)';
              setTimeout(function() {
                card.remove();

                // Smoothly scroll to the top of the NEXT lead card
                if (nextCard) {
                  scrollToLead(nextCard);
                }

                var heading = document.querySelector('h2');
                var remainingCards = document.querySelectorAll('.card');
                if (heading && heading.textContent.includes('Pending Review')) {
                  heading.textContent = 'Pending Review (' + remainingCards.length + ')';
                }
                if (remainingCards.length === 0) {
                  var main = document.querySelector('main');
                  if (main && !document.querySelector('.empty-container')) {
                    var emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-container';
                    emptyDiv.style.cssText = 'text-align: center; margin: 4rem auto; max-width: 500px; padding: 2.5rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;';
                    emptyDiv.innerHTML = '<h3 style="margin-top: 0; margin-bottom: 1.5rem; font-size: 1.25rem;">No leads waiting for review</h3>' +
                      '<a href="/queue" class="btn-approve" style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; font-size: 1.05rem; padding: 0.75rem 1.6rem; border-radius: 8px;">Review All Leads &rarr;</a>';
                    main.appendChild(emptyDiv);
                  }
                }
              }, 200);
            } else {
              form.submit();
            }
          }).catch(function() {
            form.submit();
          });
        }
      }
    });
  </script>
</body>
</html>
